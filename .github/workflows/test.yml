name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval 'try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }) } catch (e) { e }'
          for i in $(seq 1 30); do
            docker exec mongo-rs mongosh --quiet --eval 'rs.status().myState' | grep -Eq '1' && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.status().ok'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/bikeger_ci?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bikeger_ci?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_C2: mongodb://127.0.0.1:27017/bikeger_ci_c2?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_C3: mongodb://127.0.0.1:27017/bikeger_ci_c3?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_A4: mongodb://127.0.0.1:27017/bikeger_ci_a4?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_A5: mongodb://127.0.0.1:27017/bikeger_ci_a5?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_A10: mongodb://127.0.0.1:27017/bikeger_ci_a10?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_PI: mongodb://127.0.0.1:27017/bikeger_ci_pi?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_AZ: mongodb://127.0.0.1:27017/bikeger_ci_az?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI_P3: mongodb://127.0.0.1:27017/bikeger_ci_p3?replicaSet=rs0&directConnection=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contrato de papéis igual ao backend
        run: node --input-type=module -e "import a from '../backend/shared/role-capabilities.json' with { type: 'json' }; import b from './src/lib/role-capabilities.json' with { type: 'json' }; if (JSON.stringify(a) !== JSON.stringify(b)) { console.error('backend/shared e frontend/src/lib/role-capabilities.json divergiram'); process.exit(1); }"
      - run: npm test
      - run: npm run build
