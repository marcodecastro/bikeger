name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/bikeger_ci
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bikeger_ci
          MONGODB_TEST_URI_C2: mongodb://127.0.0.1:27017/bikeger_ci_c2
          MONGODB_TEST_URI_C3: mongodb://127.0.0.1:27017/bikeger_ci_c3
          MONGODB_TEST_URI_A4: mongodb://127.0.0.1:27017/bikeger_ci_a4
          MONGODB_TEST_URI_A5: mongodb://127.0.0.1:27017/bikeger_ci_a5
          MONGODB_TEST_URI_A10: mongodb://127.0.0.1:27017/bikeger_ci_a10

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contrato de papéis igual ao backend
        run: node --input-type=module -e "import a from '../backend/shared/role-capabilities.json' with { type: 'json' }; import b from './src/lib/role-capabilities.json' with { type: 'json' }; if (JSON.stringify(a) !== JSON.stringify(b)) { console.error('backend/shared e frontend/src/lib/role-capabilities.json divergiram'); process.exit(1); }"
      - run: npm test
      - run: npm run build
